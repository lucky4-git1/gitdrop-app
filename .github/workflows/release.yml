name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Verification
        run: |
          npm run typecheck
          npm run electron:compile
          npm run lint
          npm run test
          npm run build

      - name: Publish Electron Release
        uses: electron-userland/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish: always
